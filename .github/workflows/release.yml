# Cut a release by pushing a tag that matches the version in pyproject.toml:
#   git tag v1.0.0 && git push --tags
#
# The test suite gates the build; each OS job bundles the app with
# PyInstaller, smoke-tests the binary (boot + /api/health), names the
# artifact, and the last step posts every dist/* file to the GitHub Release.
name: Release

# on: the trigger key is *quoted* on purpose — unquoted `on:` parses as
# YAML boolean `True` under YAML 1.1 and GitHub's schema validation fails
"on":
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  tests:
    name: Test suite (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python tests/run_tests.py

  assets:
    name: Assets (${{ matrix.os }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        # matrix must be a *mapping*: list entries go under `include:`.
        # --add-data separator differs per OS (";" on Windows, ":" elsewhere);
        # the wheel is py3-none-any, so it's built once, on the Windows job.
        include:
          - os: windows-latest
            relname: windows-x86_64.exe
            addsep: ";"
            wheel: true
          - os: macos-latest
            relname: macos-arm64.tar.gz
            addsep: ":"
          - os: ubuntu-latest
            relname: linux-x86_64.tar.gz
            addsep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Bundle
        run: |
          # --paths . puts the repo root on the *analysis* search path: the
          # pyinstaller console script does not add CWD to sys.path like
          # `python` does, so without it the package is missing-module.
          # Kept on one physical line: backslash continuations break under
          # the Windows (PowerShell) runner, and a stray backslash becomes
          # a literal argument PyInstaller reads as the entry script
          # ('Script file "' does not exist').
          pyinstaller --noconfirm --onefile --name My3DWorkbench --paths . --workpath .pyi-work --specpath . --add-data "my3d_workbench/templates${{ matrix.addsep }}my3d_workbench/templates" --add-data "my3d_workbench/static${{ matrix.addsep }}my3d_workbench/static" build/entry_my3dworkbench.py
      - name: Smoke test the binary
        run: python build/smoke.py dist
      - name: Name the release artifact
        shell: bash   # bash is present on all GH runners, keeps this cross-OS
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "${RUNNER_OS}" in
            Windows)
              mv "dist/My3DWorkbench.exe" "dist/My3DWorkbench-${VER}-${{ matrix.relname }}"
              if [ "${{ matrix.wheel }}" = "true" ]; then
                pip wheel . -w dist --no-deps
              fi
              ;;
            *)
              tar czf "dist/My3DWorkbench-${VER}-${{ matrix.relname }}" -C dist My3DWorkbench
            # delete the raw source binary: the tarballs above are the named,
            # versioned artifacts; posting the loose file would shadow itself as
            # 'My3DWorkbench' (no extension, no OS, no version) on the release.
            rm -f dist/My3DWorkbench
              ;;
          esac
          ls -lh dist
      - name: Post to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
